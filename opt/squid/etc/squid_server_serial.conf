# squid_server_serial.conf — serial port transport configuration
#
# Use this configuration when squid-server communicates over a real
# serial link (RS-232, USB-serial adapter, retro computer UART, etc.).
#
# Serial line parameters:
#   serial_device    path to the TTY device (required to activate serial transport)
#   serial_baud      baud rate: 1200 2400 4800 9600 19200 38400 57600 115200
#   serial_databits  data bits: 7 or 8                       (default: 8)
#   serial_parity    parity:    none even odd                 (default: none)
#   serial_stopbits  stop bits: 1 or 2                       (default: 1)
#   serial_flow      flow ctrl: none rtscts xonxoff          (default: none)
#
# Common retro configurations:
#   8N1 no flow   — omit serial_databits/parity/stopbits/flow (all default)
#   8N2 RTS/CTS   — serial_stopbits 2 + serial_flow rtscts
#   7E1 XON/XOFF  — serial_databits 7 + serial_parity even + serial_flow xonxoff

serial_device /dev/ttyS0
serial_baud 9600
# serial_databits 8
# serial_parity   none
# serial_stopbits 1
# serial_flow     none

system_plugin /opt/squid/lib/plugins/libsquidsys.so

# echo plugin on port 1
plugin 1 /opt/squid/lib/plugins/libecho.so
plugin 3 /opt/squid/lib/plugins/libretrovault.so
plugin 4 /opt/squid/lib/plugins/libfilesystem.so
plugin 5 /opt/squid/lib/plugins/libtime.so
plugin 6 /opt/squid/lib/plugins/libtcp_proxy.so
