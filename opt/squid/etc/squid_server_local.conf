# squid_server_local.conf — local Unix-socket transport test configuration
#
# Use this configuration for local development and sample testing.
# The server listens on /tmp/squid_server.sock (hardcoded default).
#
# Wire channel → server port mapping used by the sample programs:
#
#   channel 1  →  port 1  →  squidsys plugin  (sys_sample)
#   channel 2  →  port 2  →  echo plugin      (echo_sample)
#
# Port 0 is always reserved for the internal squidsys plugin and is not
# accessible via the wire protocol.  It is loaded here so the server starts
# correctly; the externally-reachable squidsys instance is on port 1.

# internal system plugin (port 0 — not wire-accessible)
system_plugin /opt/squid/lib/plugins/libsquidsys.so

# squidsys on port 1 — reached by sys_sample on wire channel 1
plugin 1 /opt/squid/lib/plugins/libsquidsys.so

# echo plugin on port 2 — reached by echo_sample on wire channel 2
plugin 2 /opt/squid/lib/plugins/libecho.so
