# squid_server_local.conf — local Unix-socket transport test configuration
#
# Use this configuration for local development and sample testing.
# The server listens on /tmp/squid_server.sock (hardcoded default).
#
# Wire channel → server port mapping used by the sample programs:
#
#   channel 1  →  port 1  →  echo plugin      (echo_sample)
#   channel 2  →  port 2  →  squidsys plugin  (sys_sample)

system_plugin /opt/squid/lib/plugins/libsquidsys.so

# echo plugin on port 1 — reached by echo_sample on wire channel 1
plugin 1 /opt/squid/lib/plugins/libecho.so

# expose the system plugin to sys_sample on wire channel 2
plugin 2 /opt/squid/lib/plugins/libsquidsys.so

# Retro Vault binary package protocol (see docs/RETROVAULT_PROTOCOL.md).
plugin 3 /opt/squid/lib/plugins/libretrovault.so

# Rooted filesystem, PC time/date, and raw TCP proxy binary protocols.
plugin 4 /opt/squid/lib/plugins/libfilesystem.so
plugin 5 /opt/squid/lib/plugins/libtime.so
plugin 6 /opt/squid/lib/plugins/libtcp_proxy.so
